name: SK1 reconstructed v14 HEVC build
on:
  push:
    branches:
      - fix/sk1-vplus-beta2-restore-v14-hevc
    paths:
      - .github/workflows/sk1-v14-hevc-rebuild.yml
      - app/src/main/java/com/limelight/sk1/**
      - app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.kt
      - app/src/main/java/com/limelight/binding/video/FramePacingController.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout pinned audio haptics SDK
        uses: actions/checkout@v4
        with:
          repository: AlkaidLab/moonlight-audio-haptics
          ref: b3f97c3bb7500ea7b1985aea568e5c7b40308d3b
          path: .deps/moonlight-audio-haptics
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
      - name: Enforce SK1 integration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'var videoFormat: FormatOption = FormatOption.FORCE_HEVC' app/src/main/java/com/limelight/preferences/PreferenceConfiguration.kt
          grep -q 'TextureBridge.configure' app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.kt
          grep -q 'TextureBridge.releaseTimed' app/src/main/java/com/limelight/binding/video/FramePacingController.kt
          grep -q 'app updates on startup' app/src/main/java/com/limelight/utils/UpdateManager.kt
          echo "SK1 bridge wiring, default HEVC and startup update policy present"
      - name: Test and build isolated non-root APK
        shell: bash
        run: |
          set -euo pipefail
          export AUDIO_HAPTICS_SDK_DIR="$GITHUB_WORKSPACE/.deps/moonlight-audio-haptics"
          chmod +x gradlew
          rm -f local.properties
          ./gradlew :app:testNonRootDebugUnitTest :app:assembleNonRootDebug --no-daemon --stacktrace
      - name: Upload test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-sk1-vplus-v14-hevc-restore-experimental
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: warn
