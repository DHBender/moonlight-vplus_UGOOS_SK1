name: SK1 PyroWave Lab persistent APK

on:
  push:
    branches:
      - experiment/sk1-pyrowave-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_HAPTICS_SDK_REF: b3f97c3bb7500ea7b1985aea568e5c7b40308d3b
      AUDIO_HAPTICS_SDK_DIR: ${{ github.workspace }}/.deps/moonlight-audio-haptics
    steps:
      - name: Checkout SK1 v14 plus PyroWave experiment
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout required audio haptics SDK
        uses: actions/checkout@v4
        with:
          repository: AlkaidLab/moonlight-audio-haptics
          ref: ${{ env.AUDIO_HAPTICS_SDK_REF }}
          path: .deps/moonlight-audio-haptics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Restore persistent Lab signing key
        shell: bash
        env:
          LAB_KEYSTORE_BASE64: ${{ secrets.LAB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$LAB_KEYSTORE_BASE64" ]; then
            echo "::error::LAB_KEYSTORE_BASE64 is not configured. Keep this key constant across future Lab builds."
            exit 1
          fi
          printf '%s' "$LAB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sk1-pyrowave-lab.jks"
          chmod 600 "$RUNNER_TEMP/sk1-pyrowave-lab.jks"

      - name: Build updateable Lab APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sk1-pyrowave-lab.jks
          KEYSTORE_PASSWORD: ${{ secrets.LAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRootDebug --no-daemon --stacktrace \
            -Psk1Lab=true -Psk1LabRun=${{ github.run_number }}

      - name: Verify optimized ARMv7 compilation settings
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'LOCAL_CPPFLAGS += -O3' app/src/main/jni/moonlight-core/Android.mk
          test -f app/src/main/jni/moonlight-core/pyrowave_sdr_neon.cpp

      - name: Confirm 32-bit PyroWave runtime is present
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/nonRoot/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/armeabi-v7a/libpyrowave-shared.so'

      - name: Verify stable Lab package and signing
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/nonRoot/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$apk" | grep -E "^package: name='com.limelight.vplus_sk1_pyrowave_lab'"
          "$AAPT" dump badging "$apk" | grep -F "application-label:'PyroWave Lab'"
          unzip -Z1 "$apk" | grep -Fx 'lib/armeabi-v7a/libpyrowave-shared.so'

      - name: Upload experimental APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SK1-PyroWave-Lab-APK
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
