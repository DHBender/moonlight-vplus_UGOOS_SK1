name: SK1 PyroWave ARMv7 NEON experiment

on:
  push:
    branches:
      - experiment/sk1-pyrowave-neon-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_HAPTICS_SDK_REF: b3f97c3bb7500ea7b1985aea568e5c7b40308d3b
      AUDIO_HAPTICS_SDK_DIR: ${{ github.workspace }}/.deps/moonlight-audio-haptics
    steps:
      - name: Checkout SK1 v14 plus PyroWave experiment
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout required audio haptics SDK
        uses: actions/checkout@v4
        with:
          repository: AlkaidLab/moonlight-audio-haptics
          ref: ${{ env.AUDIO_HAPTICS_SDK_REF }}
          path: .deps/moonlight-audio-haptics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Give experiment a separate app ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          src = path.read_text(encoding='utf-8')
          old = 'applicationIdSuffix ".vplus_debug"'
          assert src.count(old) == 1, 'Debug application ID anchor changed'
          src = src.replace(old, 'applicationIdSuffix ".vplus_sk1_pyrowave_neon_v2"', 1)
          path.write_text(src, encoding='utf-8')
          PY

      - name: Build experimental APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRootDebug --no-daemon --stacktrace

      - name: Confirm 32-bit PyroWave runtime is present
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/nonRoot/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/armeabi-v7a/libpyrowave-shared.so'

      - name: Upload experimental APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SK1-PyroWave-NEON-v2-APK
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
