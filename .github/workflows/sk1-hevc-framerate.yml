name: SK1 HEVC frame rate and presentation diagnostics

on:
  push:
    branches:
      - sk1-hevc-framerate-presentation-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_HAPTICS_SDK_REF: b3f97c3bb7500ea7b1985aea568e5c7b40308d3b
      AUDIO_HAPTICS_SDK_DIR: ${{ github.workspace }}/.deps/moonlight-audio-haptics
    steps:
      - name: Checkout SK1 experiment source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout required audio haptics SDK
        uses: actions/checkout@v4
        with:
          repository: AlkaidLab/moonlight-audio-haptics
          ref: ${{ env.AUDIO_HAPTICS_SDK_REF }}
          path: .deps/moonlight-audio-haptics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      # android-actions/setup-android already accepts required Android SDK licenses.
      # A separate 'yes | sdkmanager --licenses' fails under bash pipefail with
      # 'yes: standard output: Broken pipe' once sdkmanager stops reading.

      - name: Validate isolated HEVC sync patch and configure standalone package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.kt').read_text(encoding='utf-8')
          assert renderer.count('SK1RATE: KEY_FRAME_RATE omitted for SK1 HEVC; async and low latency unchanged') == 1, 'SK1RATE patch missing'
          assert 'sk1RateSurfaceCallbacks.incrementAndGet()' in renderer
          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          old = '''        debug {
                      applicationIdSuffix ".vplus_debug"
                      resValue "string", "app_label", audioHapticsAppLabel'''
          new = '''        debug {
                      applicationIdSuffix ".vplus_sk1rate"
                      resValue "string", "app_label", "Moonlight SK1 Rate"'''
          assert text.count(old) == 1, 'Unexpected debug package configuration'
          gradle.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('SK1RATE experimental package configured; async and low latency unchanged')
          PY

      - name: Build separate debug APK (does not replace normal V+)
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleNonRootDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SK1-HEVC-FRAMERATE-DIAGNOSTIC-APK
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
